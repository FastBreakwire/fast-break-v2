# Static site, no build step. index.html and the data/ files ship as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/data/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60"

# Article routes are client-side (/story/{id}). Serve index.html for them so a
# refresh or a shared link resolves instead of 404-ing. Status 200 keeps the
# URL in the address bar; the router reads it and renders the story.
[[redirects]]
  from = "/story/*"
  to = "/index.html"
  status = 200

# Game detail routes are client-side too (/game/{league}/{id}). Same reasoning
# as /story/* above — a refresh or a shared link must resolve to the app, not
# a 404, so the router can read the path and fetch the right match.
[[redirects]]
  from = "/game/*"
  to = "/index.html"
  status = 200

# Team Page routes are client-side too (/team/{league}/{teamId}). Same
# reasoning as /story/* and /game/* above.
[[redirects]]
  from = "/team/*"
  to = "/index.html"
  status = 200
